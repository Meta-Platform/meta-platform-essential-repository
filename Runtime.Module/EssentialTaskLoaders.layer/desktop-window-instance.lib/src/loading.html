<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carregando…</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --fg: #1c1e21;
            --muted: #6b7280;
            --accent: #2f6fed;
            --ring: rgba(47, 111, 237, 0.18);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181d;
                --fg: #e8eaed;
                --muted: #9aa0a6;
                --accent: #5b8def;
                --ring: rgba(91, 141, 239, 0.22);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 32px;
            text-align: center;
        }
        .spinner {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 4px solid var(--ring);
            border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
        .subtitle { font-size: 13px; color: var(--muted); max-width: 320px; line-height: 1.5; }
        .dots::after {
            content: "";
            animation: dots 1.4s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <div class="title">Preparando a interface<span class="dots"></span></div>
        <div class="subtitle">Aguarde enquanto a aplicação é iniciada e compilada. A tela será atualizada automaticamente assim que estiver pronta.</div>
    </div>
</body>
</html>
